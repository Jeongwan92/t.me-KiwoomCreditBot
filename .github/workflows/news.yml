YAML
name: News Monitor Bot

on:
  schedule:
    # 매 10분마다 자동 실행
    - cron: '*/10 * * * *'
  workflow_dispatch: # 수동으로 즉시 실행할 수 있는 버튼 활성화

jobs:
  run-bot:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 저장소 코드 가져오기
        uses: actions/checkout@v4

      - name: 파이썬 환경 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 필수 라이브러리 설치
        run: |
          python -m pip install --upgrade pip
          pip install feedparser requests google-genai

      - name: 뉴스 봇 실행
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python bot.py

      - name: 발송 이력 저장(중복 전송 방지)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add sent_links.txt || true
          git commit -m "Update sent links history [skip ci]" || true
          git push || true
